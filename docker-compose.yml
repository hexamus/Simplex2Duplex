# Simplex2Duplex — Synology example (Container Manager > Project)
# Adapt the left-hand (host) paths to your NAS; leave the right-hand ones unchanged.
# Documentation: README.md (English) / README.fr.md (Français)

services:
  simplex2duplex:
    image: ghcr.io/hexamus/simplex2duplex:latest
    container_name: simplex2duplex
    restart: unless-stopped
    # UID:GID of the SMB user the scanner writes as (`id <user>` over SSH).
    # Output PDFs will belong to it, and it can delete/archive the originals.
    user: "1026:100"
    volumes:
      - /volume1/Papier/tmp_scan:/input     # where the scanner drops the 2 PDFs
      - /volume1/Papier/Scans:/output       # where the double-sided PDF lands
    environment:
      TZ: Europe/Paris
      APP_LANG: "fr"             # logs, notifications & default OCR language: fr | en

      # --- Pairing -------------------------------------------------------
      PAIR_TIMEOUT: "900"        # s; lone file after this delay → published as is (0 = wait)
      STABLE_SECONDS: "10"       # s without changes before a file is considered complete
      REVERSE_EVEN: "true"       # backs scanned from the flipped stack → reversed order
      ROTATE_EVEN: "0"           # 180 if your back pages come out upside down
      REMOVE_BLANK: "false"      # true = remove blank back pages
      BLANK_THRESHOLD: "0.5"     # ink % below which a back page counts as blank

      # --- Quality / OCR -------------------------------------------------
      OCR: "keep"                # keep | auto | redo | force
      # OCR_LANG: "fra+eng"      # default follows APP_LANG (fr → fra+eng, en → eng)
      OPTIMIZE: "0"              # 0 = no recompression; 1 lossless; 2-3 lossy
      OUTPUT_TYPE: "pdf"         # pdf | pdfa

      # --- Files ---------------------------------------------------------
      FILENAME_PATTERN: "Scan_%Y-%m-%d_%H-%M-%S"
      ORIGINALS: "keep"          # keep → /input/_originaux; delete → removed
      LOG_LEVEL: "INFO"

      # --- Notifications (optional) --------------------------------------
      # Events: success, partial, single, error, startup — or all / none
      NOTIFY_EVENTS: "error,partial"
      # TELEGRAM_BOT_TOKEN: "123456:ABC-DEF..."
      # TELEGRAM_CHAT_ID: "123456789"
      # TELEGRAM_EVENTS: "all"            # Telegram-only filter (otherwise NOTIFY_EVENTS)
      # NTFY_URL: "https://ntfy.sh/my-secret-topic"
      # NTFY_TOKEN: "tk_..."
      # NTFY_EVENTS: "all"
      # APPRISE_URLS: "discord://id/token gotify://host/token"
      # APPRISE_EVENTS: "error"
      # APPRISE_API_URL: "http://apprise:8000/notify/my-key"
